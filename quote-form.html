<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Get a Quote</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f2f4f6;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    padding: 32px;
    width: 100%;
    max-width: 420px;
  }
  .field {
    width: 100%;
    padding: 14px 16px;
    border: 1px solid #d9dde2;
    border-radius: 10px;
    font-size: 15px;
    color: #333;
    margin-bottom: 8px;
    outline: none;
  }
  .field::placeholder {
    color: #9aa1a8;
  }
  .field:focus {
    border-color: #e8621d;
  }
  .link-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 20px;
  }
  a.link {
    color: #e8621d;
    text-decoration: underline;
    font-weight: 600;
  }
  .label {
    font-size: 12px;
    color: #e8621d;
    font-weight: 600;
    margin-bottom: 6px;
    display: block;
  }
  .mobile-field {
    border-color: #e8621d;
    border-width: 2px;
    margin-bottom: 24px;
  }
  .btn {
    width: 100%;
    background: #e8621d;
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 16px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 20px;
  }
  .btn:hover {
    background: #d5560f;
  }
  .retrieve {
    display: block;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .checkbox-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 13px;
    color: #333;
    margin-bottom: 12px;
  }
  .checkbox-row input {
    accent-color: #e8621d;
    width: 18px;
    height: 18px;
    margin-top: 1px;
    flex-shrink: 0;
  }
  .whatsapp {
    color: #25D366;
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="card">
  <input class="field" type="text" placeholder="Vehicle registration number">

  <div class="link-row">
    <a href="#" class="link">Got a new vehicle</a>
    <a href="#" class="link">What is this?</a>
  </div>

  <span class="label">Mobile number</span>
  <input class="field mobile-field" type="tel">

  <button class="btn">Get quote</button>

  <a href="#" class="link retrieve">Retrieve quote</a>

  <label class="checkbox-row">
    <input type="checkbox" checked>
    <span>I agree to the <a href="#" style="color:#333; text-decoration: underline;">terms and conditions</a></span>
  </label>

  <label class="checkbox-row">
    <input type="checkbox" checked>
    <span>I want to receive updates on <span class="whatsapp">&#128222; WhatsApp</span></span>
  </label>
</div>

</body>
</html>
